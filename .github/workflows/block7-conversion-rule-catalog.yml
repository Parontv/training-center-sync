name: Block 7 conversion rule catalog
on:
  push:
    branches: [feat/grafana-automated-builder]
  pull_request:
    branches: [feat/grafana-automated-builder]
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node grafana/test-block7-conversion-rule-catalog.mjs
