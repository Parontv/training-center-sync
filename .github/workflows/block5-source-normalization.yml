name: Block 5 source query normalization
on:
  push:
    branches: [feat/grafana-automated-builder]
  pull_request:
    branches: [feat/grafana-automated-builder]
jobs:
  normalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node grafana/test-block5-source-normalization.mjs
