name: Block 4 conversion engine regression
on:
  push:
    branches: [feat/grafana-automated-builder]
  pull_request:
    branches: [feat/grafana-automated-builder]
jobs:
  conversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node grafana/test-block4-conversion-regression.mjs
