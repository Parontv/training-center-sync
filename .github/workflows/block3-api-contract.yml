name: Block 3 read-only API contract
on:
  push:
    branches: [feat/grafana-automated-builder]
  pull_request:
    branches: [feat/grafana-automated-builder]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node grafana/test-block3-api-contract.mjs
