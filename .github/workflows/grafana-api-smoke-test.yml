name: Grafana API smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check required credentials
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          test -n "$GRAFANA_URL" || { echo "Missing GRAFANA_URL repository secret"; exit 1; }
          test -n "$GRAFANA_TOKEN" || { echo "Missing GRAFANA_TOKEN repository secret"; exit 1; }
      - name: Verify Grafana API access (read-only)
        env:
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
        run: |
          set -euo pipefail
          BASE="${GRAFANA_URL%/}"
          echo "Checking authenticated Grafana user..."
          curl --fail --silent --show-error -H "Authorization: Bearer $GRAFANA_TOKEN" "$BASE/api/user" -o /tmp/grafana-user.json
          node -e 'const d=require("/tmp/grafana-user.json"); if(!d.login && !d.email) process.exit(1); console.log("Authenticated API user:",d.login || d.email)'
          echo "Checking datasource API..."
          curl --fail --silent --show-error -H "Authorization: Bearer $GRAFANA_TOKEN" "$BASE/api/datasources" -o /tmp/grafana-ds.json
          node -e 'const d=require("/tmp/grafana-ds.json"); if(!Array.isArray(d)) process.exit(1); console.log("Datasource count:",d.length); for(const x of d) console.log("-",x.name,"(",x.type,")",x.uid ? "uid="+x.uid : "")'
          echo "Checking dashboard search API..."
          curl --fail --silent --show-error -H "Authorization: Bearer $GRAFANA_TOKEN" "$BASE/api/search?type=dash-db" -o /tmp/grafana-dashboards.json
          node -e 'const d=require("/tmp/grafana-dashboards.json"); if(!Array.isArray(d)) process.exit(1); console.log("Dashboard count:",d.length); for(const x of d.slice(0,20)) console.log("-",x.title,"uid="+x.uid)'
          echo "Grafana API smoke test passed. All requests were read-only."
