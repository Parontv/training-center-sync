name: Field matching scaffold validation
on:
  pull_request:
    paths:
      - grafana/PROGRESSIVE_CONVERSION_PHASES.json
      - grafana/suggest-live-field-matches.mjs
      - grafana/test-field-match-suggestions.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate suggestion guardrails
        run: node grafana/test-field-match-suggestions.mjs
      - name: Generate suggestions if live snapshot exists
        run: node grafana/suggest-live-field-matches.mjs
