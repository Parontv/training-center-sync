name: Block 8 source query shape extraction
on:
  push:
    branches: [feat/grafana-automated-builder]
  pull_request:
    branches: [feat/grafana-automated-builder]
jobs:
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node grafana/test-block8-query-shape-extraction.mjs
